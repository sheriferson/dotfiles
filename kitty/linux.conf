# Clipboard
map super+v             paste_from_clipboard
map ctrl+shift+s        paste_from_selection
map super+shift+c             copy_to_clipboard

# Tab management
map ctrl+t             new_tab
map shift+ctrl+w       close_tab
map shift+ctrl+t       set_tab_title

map shift+super+]      next_tab
map shift+super+[      previous_tab


include themes/${KITTY_OS}_theme.conf
